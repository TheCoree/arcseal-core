[tool.poetry]
name = "arcseal-backend"
version = "0.1.0"
description = "Arcseal backend application"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "0.111.1"
uvicorn = { version = "0.30.6", extras = ["standard"] }
sqlalchemy = "2.0.49"
asyncpg = "0.29.0"
alembic = "1.18.4"
pydantic = "2.13.4"
pydantic-settings = "2.14.1"
email-validator = "2.3.0"
bcrypt = "4.3.0"
pyjwt = "2.12.1"
python-dotenv = "1.2.2"
python-multipart = "0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
